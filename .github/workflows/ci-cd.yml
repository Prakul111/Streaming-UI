name: CI/CD Pipeline

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 1. Quality Gate: TypeScript check & Production Build
  # -----------------------------------------------------------
  typecheck-and-build:
    name: Verify Types & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build (TypeScript + Vite)
        env:
          VITE_TMDB_API: ${{ secrets.VITE_TMDB_API }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run build

  # -----------------------------------------------------------
  # 2. Automated Production Deployment (Vercel)
  # -----------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: typecheck-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'Prakul111'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
